# Jeu de test du chatbot.
# Chaque question a une réponse attendue, la ou les règles qui la justifient,
# et un statut : officielle | test_international | ancienne_regle | hors_sujet.
# À compléter avec les questions de terrain (objectif : 20) et les cas du casebook.

questions:
  - id: q001
    question: "Est-ce que la double touche à la passe est encore une faute ?"
    reponse_attendue: >-
      Oui. Un joueur ne peut pas toucher le ballon deux fois de suite (double touche).
      Seule la première touche de l'équipe tolère des contacts successifs au cours de la même action.
    regles: ["9.3.4", "9.2.3", "9.2.3.2"]
    statut: officielle
    piege: "Plusieurs sites affirment à tort qu'elle est désormais tolérée."

  - id: q002
    question: "Quand on sert, est-ce qu'on doit encore respecter l'ordre de rotation sur le terrain ?"
    reponse_attendue: >-
      Non. Depuis 2025, les joueurs de l'équipe au service peuvent se placer librement au moment de la frappe.
      Seule l'équipe en réception doit respecter l'ordre de rotation. L'ordre au service, lui, reste obligatoire.
    regles: ["7.4", "12.2"]
    statut: officielle
    piege: "Des guides d'avant 2025 disent le contraire."

  - id: q003
    question: "Le libéro peut-il servir ?"
    reponse_attendue: "Non, le libéro ne peut ni servir, ni contrer, ni tenter de contrer."
    regles: ["19.3.1.3"]
    statut: officielle

  - id: q004
    question: "Quelle est la meilleure tactique pour battre une équipe qui joue en 6-2 ?"
    reponse_attendue: "Hors du périmètre : c'est une question de tactique, pas de règlement."
    regles: []
    statut: hors_sujet
